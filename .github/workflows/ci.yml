name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Build golangci-lint from source with the job's Go toolchain (Go 1.26 via
      # go.mod). The prebuilt release binaries lag the Go release and are built
      # with an older Go; modern golangci-lint then refuses to run against a
      # module that targets a newer Go ("built with go1.24 < targeted 1.26.1"),
      # which is what was failing every push. Building from source keeps the
      # linter's build-Go in lockstep with the module.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run ./...

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Typechecks (tsc -b) and compiles the dashboard (vite build). Catches the
      # kind of TS regression we would otherwise only find by running tsc by hand.
      - name: Typecheck & build
        working-directory: web
        run: npm run build
